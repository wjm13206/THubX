name: Build THubX (dist)

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "build/**"
      - "package.json"
      - "rokit.toml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rokit
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true

      - name: Run build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: THubX-dist
          path: dist/THubX.lua

      - name: Commit dist/THubX.lua back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/THubX.lua
          git commit -m "[AUTO] Upload built THubX.lua" || exit 0
          git push
